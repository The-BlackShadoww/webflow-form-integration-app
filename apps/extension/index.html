<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Integration</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        font-family: "Outfit", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f9f7f3; /* Canvas / Warm Cream */
        color: #1c1c1c; /* Charcoal / Ink */
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        text-align: center;
        background: white;
        border-radius: 16px;
        padding: 32px 24px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        border: 1px solid #e5e5e5;
      }
      h1 { font-size: 20px; margin-bottom: 12px; font-weight: 600; letter-spacing: -0.02em; }
      p { font-size: 14px; color: #555555; margin: 0 0 24px; line-height: 1.5; }
      .btn {
        background: #ea2804; /* Orange accent */
        color: white;
        border: 0;
        padding: 12px 20px;
        border-radius: 9999px; /* Full rounded */
        font-size: 14px;
        cursor: pointer;
        font-weight: 600;
        transition: background-color 0.2s ease, transform 0.1s ease;
        width: 100%;
      }
      .btn:hover { background: #d02003; }
      .btn:active { transform: scale(0.98); }
      .muted { font-size: 12px; color: #888888; margin-top: 16px; margin-bottom: 0; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Form Integration</h1>
      <p>Configure mappings, manage Notion credentials, and view submission logs in the central dashboard.</p>
      <button class="btn" id="open">Launch Dashboard</button>
      <p class="muted">All settings live securely in your web dashboard.</p>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
